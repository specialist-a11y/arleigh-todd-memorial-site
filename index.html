<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>In loving memory of Arleigh Arthur Patrick Todd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Mulish:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--night:#1C1712;--night2:#262019;--wax:#F3E6CF;--flame:#E9A23B;--ember:#8A4B1E;--smoke:#A79B8A;--line:#3A3128;
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Mulish",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--night)}
body{margin:0;background:var(--night);color:var(--wax);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img,video{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--flame);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.hero{text-align:center;padding:48px 0 40px;position:relative}
.hero::before{content:"";position:absolute;left:50%;top:40px;width:520px;max-width:120%;height:520px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(233,162,59,.16),rgba(233,162,59,0));pointer-events:none}
.arch{position:relative;width:min(240px,62vw);aspect-ratio:3/4;margin:0 auto;border-radius:999px 999px 14px 14px;overflow:hidden;border:1px solid rgba(233,162,59,.45);padding:6px;background:var(--night2)}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;border-radius:999px 999px 10px 10px}
.intro{margin:28px 0 0;font-size:15px;color:var(--flame);letter-spacing:.04em}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(32px,8.5vw,64px);line-height:1.08;margin:8px auto 0;padding:0 20px;letter-spacing:-.01em;word-break:break-word}
.dates{font-family:var(--serif);font-size:20px;color:var(--flame);margin:8px 0 0;font-style:italic;letter-spacing:.02em}
.lede{font-family:var(--serif);font-size:21px;line-height:1.5;color:#D9CBB2;max-width:30ch;margin:18px auto 0}
.cta{margin:30px auto 0;max-width:420px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:999px;border:1px solid var(--flame);background:var(--flame);color:#2A1706;font-weight:600;font-size:16px;padding:0 22px}
.btn:hover{background:#F2B55A}
.ghost{background:transparent;color:var(--flame)}
.ghost:hover{background:rgba(233,162,59,.1)}
.btn.danger{background:#5A1B14;border-color:#8A2B1E;color:#FCA5A5}
.btn.danger:hover{background:#73231B;color:#FFF}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;width:auto}
.my-actions{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.tally{margin:14px 0 0;font-size:14px;color:var(--smoke)}
.tally button{background:none;border:0;color:var(--wax);text-decoration:underline;text-underline-offset:3px;padding:0}
.form{text-align:left;background:var(--night2);border:1px solid var(--line);padding:20px;border-radius:16px}
.form label{display:block;font-size:14px;color:var(--flame);margin-bottom:6px;margin-top:12px}
.form label:first-child{margin-top:0}
.form input,.form textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:#18130E;color:var(--wax);font:inherit;font-size:16px;padding:12px 16px}
.form input{height:48px}
.form textarea{min-height:88px;resize:vertical;line-height:1.4}
.form input:focus,.form textarea:focus{border-color:var(--flame);outline:none}
.err{color:#F0A08A;font-size:14px;margin:10px 0 0;min-height:1em}
.form .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.flame{display:inline-block;width:14px;height:20px;position:relative}
.flame::before{content:"";position:absolute;inset:0;background:currentColor;border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.bigflame{width:22px;height:34px;color:var(--flame);margin:0 auto;animation:flick 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(.94,1.05) rotate(-2deg)}60%{transform:scale(1.03,.97) rotate(1.5deg)}}
@media (prefers-reduced-motion:reduce){.bigflame{animation:none}}
.sec{border-top:1px solid var(--line);padding-top:40px;padding-bottom:20px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h2{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.1;margin:0}
.meta{color:var(--smoke);font-size:14px}
.gal{columns:2;column-gap:10px}
@media(min-width:700px){.gal{columns:3;column-gap:14px}}
@media(min-width:1000px){.gal{columns:4}}
.it{break-inside:avoid;margin:0 0 10px;position:relative;border:0;padding:0;background:var(--night2);border-radius:10px;overflow:hidden;width:100%;display:block}
@media(min-width:700px){.it{margin-bottom:14px}}
.it img{width:100%;height:auto;transition:opacity .2s}
.it:hover img{opacity:.88}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.play span{width:52px;height:52px;border-radius:50%;background:rgba(28,23,18,.72);border:1px solid rgba(243,230,207,.6);display:flex;align-items:center;justify-content:center}
.play span::before{content:"";margin-left:4px;border-left:16px solid var(--wax);border-top:10px solid transparent;border-bottom:10px solid transparent}
.lb{position:fixed;inset:0;background:rgba(14,11,8,.96);z-index:20;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb.on{display:flex}
.lbbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:var(--smoke);font-size:14px}
.ib{background:none;border:1px solid var(--line);color:var(--wax);width:44px;height:44px;border-radius:50%;font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.lbstage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 10px;touch-action:pan-y}
.lbstage img,.lbstage video{max-height:100%;max-width:100%;object-fit:contain;border-radius:6px}
.lbnav{display:flex;justify-content:center;gap:16px;padding:12px}
.view{display:none}
.view.on{display:block}
.back{background:none;border:0;color:var(--flame);font-size:15px;padding:24px 0 0;display:inline-flex;gap:8px;align-items:center}
.wallhead{text-align:center;padding:28px 0 28px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding-bottom:30px}
@media(max-width:480px){.wall{grid-template-columns:1fr}}
.cd{background:var(--night2);border:1px solid var(--line);border-radius:14px;padding:18px 14px 16px;text-align:center;display:flex;flex-direction:column;align-items:center}
.cd .flame{color:var(--flame);margin-bottom:8px}
.cd .wick{width:22px;height:32px;margin:0 auto;border-radius:4px 4px 2px 2px;background:linear-gradient(#EFE2C9,#CDBB98)}
.cd .name{margin:10px 0 0;font-family:var(--serif);font-size:20px;line-height:1.25;word-break:break-word;font-weight:500}
.cd .tribute{font-family:var(--serif);font-style:italic;font-size:16px;color:#D9CBB2;margin:10px 0 0;line-height:1.4;word-break:break-word;border-top:1px solid rgba(233,162,59,.18);padding-top:10px;width:100%}
.cd.me{border-color:var(--flame);background:#2E2418}
.cd.me small{display:block;color:var(--flame);font-size:12px;margin-top:4px;font-family:var(--sans)}
html,body{overflow-x:hidden}
.h-scroll-section{margin-bottom:28px}
.h-scroll-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.h-scroll-head span{font-size:13px;color:var(--flame);letter-spacing:.03em;display:flex;align-items:center;gap:6px}
.h-scroll-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:12px;scrollbar-width:thin;scrollbar-color:var(--flame) transparent}
.h-scroll-track::-webkit-scrollbar{height:5px}
.h-scroll-track::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:999px}
.h-scroll-track::-webkit-scrollbar-thumb{background:var(--flame);border-radius:999px}
.h-item{flex:0 0 clamp(200px,68vw,280px);scroll-snap-align:center;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--night2);position:relative;aspect-ratio:3/4;cursor:pointer;margin:0}
.h-item img{width:100%;height:100%;object-fit:cover;transition:transform .3s,opacity .3s}
.h-item:hover img{transform:scale(1.03);opacity:.9}
@media(max-width:600px){
  .wall{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:16px;scrollbar-width:thin;scrollbar-color:var(--flame) transparent}
  .wall::-webkit-scrollbar{height:4px}
  .wall::-webkit-scrollbar-thumb{background:var(--flame);border-radius:999px}
  .cd{flex:0 0 85vw;max-width:320px;scroll-snap-align:center}
}
.obituary-card{max-width:480px;margin:20px auto 24px;border-radius:16px;overflow:hidden;border:1px solid rgba(233,162,59,.35);box-shadow:0 8px 24px rgba(0,0,0,.4);background:var(--night2)}
.obituary-card img{width:100%;height:auto;display:block}
.empty{text-align:center;color:var(--smoke);padding:10px 0 40px;font-size:15px}
footer{text-align:center;padding:36px 20px 44px;border-top:1px solid var(--line);margin-top:20px}
footer p{margin:0;font-family:var(--serif);font-size:24px;color:var(--flame)}
</style>
</head>
<body>
<main>
<div id="home" class="view on">
<section class="hero wrap">
<div class="arch"><img src="media/45.jpg" alt="Arleigh Arthur Patrick Todd"></div>
<p class="intro">In loving memory of</p>
<h1>Arleigh Arthur Patrick Todd</h1>
<p class="dates">20 March 1961 &ensp;|&ensp; 25 August 2026</p>
<p class="lede">Thank you for joining us to celebrate a life that touched so many of us.</p>
<div class="cta" id="cta"></div>
<p class="tally"><span id="tally"></span> <button type="button" id="seeWall">See the candles</button></p>
</section>
<section class="sec wrap" aria-labelledby="memh">
<div class="h-scroll-section">
<div class="h-scroll-head">
  <h2>Featured Memories</h2>
  <span>Swipe left & right &rarr;</span>
</div>
<div class="h-scroll-track" id="hScrollTrack"></div>
</div>
<div class="sechead"><h2 id="memh">All Memories</h2><span class="meta" id="memcount"></span></div>
<div class="gal" id="gal"></div>
</section>
</div>
<div id="candles" class="view">
<div class="wrap">
<button type="button" class="back" id="back">&#8592; Back to memories</button>
<div class="wallhead">
<div class="flame bigflame" aria-hidden="true"></div>
<h2 style="margin-top:16px">Candles for Arleigh</h2>
<p class="meta" id="wallcount" style="margin:8px 0 0"></p>
<div class="obituary-card">
<img src="media/obituary.jpg" alt="In Loving Memory Notice for Arleigh Todd" loading="lazy">
</div>
<div class="cta" id="cta2"></div>
</div>
<div class="wall" id="wall"></div>
</div>
</div>
</main>
<footer><p>Forever in our hearts</p></footer>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Memory viewer">
<div class="lbbar"><span id="lbpos"></span><button class="ib" id="lbclose" aria-label="Close">&#10005;</button></div>
<div class="lbstage" id="lbstage"></div>
<div class="lbnav"><button class="ib" id="lbprev" aria-label="Previous">&#8592;</button><button class="ib" id="lbnext" aria-label="Next">&#8594;</button></div>
</div>

const SB_URL=(window.CANDLES_CONFIG||{}).supabaseUrl||"",SB_KEY=(window.CANDLES_CONFIG||{}).supabaseKey||"";
const SHARED=!!(SB_URL&&SB_KEY);
const KEY="apt-candle-mine";
let candles=[],mineId=null,loaded=false;
try{mineId=localStorage.getItem(KEY);}catch(e){}
const H={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};

async function load(){
  if(!SHARED){
    try{candles=JSON.parse(localStorage.getItem("apt-candles-local")||"[]");}catch(e){candles=[];}
    loaded=true;renderAll();return;
  }
  try{
    const r=await fetch(SB_URL+"/rest/v1/candles?select=id,name,tribute,created_at&order=created_at.desc&limit=1000",{headers:H});
    if(!r.ok)throw 0;
    candles=await r.json();
    loaded=true;
    renderAll();
  }catch(e){}
}

async function addCandle(name,tribute){
  if(!SHARED){
    const row={id:"l"+Date.now(),name,tribute,created_at:new Date().toISOString()};
    candles.unshift(row);
    mineId=row.id;
    try{localStorage.setItem("apt-candles-local",JSON.stringify(candles));localStorage.setItem(KEY,row.id);}catch(e){}
    return;
  }
  const r=await fetch(SB_URL+"/rest/v1/candles",{method:"POST",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify({name,tribute})});
  if(!r.ok)throw new Error("save");
  const row=(await r.json())[0];
  mineId=row.id;
  try{localStorage.setItem(KEY,row.id);}catch(e){}
  candles=candles.filter(c=>String(c.id)!==String(row.id));
  candles.unshift(row);
}

async function updateCandle(id,name,tribute){
  if(!SHARED){
    const c=candles.find(x=>String(x.id)===String(id));
    if(c){c.name=name;c.tribute=tribute;}
    try{localStorage.setItem("apt-candles-local",JSON.stringify(candles));}catch(e){}
    return;
  }
  const r=await fetch(SB_URL+"/rest/v1/candles?id=eq."+encodeURIComponent(id),{
    method:"PATCH",
    headers:{...H,"Prefer":"return=representation"},
    body:JSON.stringify({name,tribute})
  });
  if(!r.ok)throw new Error("update");
  const updated=(await r.json())[0];
  if(updated){
    const idx=candles.findIndex(x=>String(x.id)===String(id));
    if(idx!==-1)candles[idx]=updated;
  }
}

async function deleteCandle(id){
  if(!SHARED){
    candles=candles.filter(x=>String(x.id)!==String(id));
    mineId=null;
    try{localStorage.removeItem(KEY);localStorage.setItem("apt-candles-local",JSON.stringify(candles));}catch(e){}
    return;
  }
  const r=await fetch(SB_URL+"/rest/v1/candles?id=eq."+encodeURIComponent(id),{
    method:"DELETE",
    headers:H
  });
  if(!r.ok)throw new Error("delete");
  candles=candles.filter(x=>String(x.id)!==String(id));
  mineId=null;
  try{localStorage.removeItem(KEY);}catch(e){}
}

const $=id=>document.getElementById(id);
function plural(n){return n===1?"1 candle lit":n+" candles lit";}
function renderCounts(){const t=!loaded?"":candles.length?plural(candles.length):"No candles lit yet.";$("tally").textContent=t;$("wallcount").textContent=candles.length?plural(candles.length):"";}

function getMyCandle(){
  return mineId?candles.find(c=>String(c.id)===String(mineId)):null;
}

function renderCta(el, force){
  if(!force && (el.hasAttribute("data-form-open") || el.querySelector(".form"))) return;
  el.removeAttribute("data-form-open");
  el.innerHTML="";
  const myCandle=getMyCandle();
  if(myCandle){
    const box=document.createElement("div");
    box.style.cssText="background:var(--night2);border:1px solid var(--flame);border-radius:16px;padding:16px;text-align:center;";
    box.innerHTML='<p class="meta" style="color:var(--flame);font-weight:600;margin:0 0 6px;">Your candle is lit</p><div class="my-actions"><button type="button" class="btn sm edit-btn"><span class="flame" aria-hidden="true"></span>Edit Candle & Tribute</button><button type="button" class="btn sm danger delete-btn">Remove</button></div>';
    box.querySelector(".edit-btn").onclick=()=>openForm(el, true);
    box.querySelector(".delete-btn").onclick=()=>confirmDelete(el, myCandle.id);
    el.appendChild(box);
    return;
  }
  const b=document.createElement("button");b.type="button";b.className="btn";b.innerHTML='<span class="flame" aria-hidden="true"></span>Light a candle & share a tribute';
  b.onclick=()=>openForm(el, false);el.appendChild(b);
}

function confirmDelete(el, id){
  if(confirm("Are you sure you want to remove your candle and tribute?")){
    deleteCandle(id).then(()=>{renderCta(el, true);renderAll();}).catch(()=>{alert("Unable to remove candle. Please check your connection.");});
  }
}

function openForm(el, isEdit){
  el.setAttribute("data-form-open", "true");
  const myCandle=isEdit?getMyCandle():null;
  const initName=myCandle?myCandle.name:"";
  const initTribute=myCandle&&myCandle.tribute?myCandle.tribute:"";
  
  el.innerHTML='<div class="form"><label for="nm_'+el.id+'">Your Name</label><input id="nm_'+el.id+'" maxlength="40" autocomplete="name" placeholder="Jane Smith" value="'+escapeHtml(initName)+'"><label for="tr_'+el.id+'">Your Tribute / Memory <span style="opacity:0.7;font-weight:normal">(Optional)</span></label><textarea id="tr_'+el.id+'" maxlength="300" placeholder="Share a cherished memory, blessing, or tribute...">' + escapeHtml(initTribute) + '</textarea><p class="err" aria-live="polite"></p><div class="row"><button type="button" class="btn ghost cancel">Cancel</button>' + (isEdit?'<button type="button" class="btn danger del-form">Remove</button>':'') + '<button type="button" class="btn go"><span class="flame" aria-hidden="true"></span>' + (isEdit?'Save Changes':'Light My Candle') + '</button></div></div>';
  
  const inp=el.querySelector("input"),trInp=el.querySelector("textarea"),err=el.querySelector(".err");
  inp.focus();
  inp.oninput=()=>{err.textContent="";};
  
  const go=()=>{
    const vName=inp.value.trim().replace(/\s+/g," ");
    const vTribute=trInp.value.trim();
    if(!vName){err.textContent="Please enter your name.";inp.focus();return;}
    const gb=el.querySelector(".go");gb.disabled=true;gb.lastChild.textContent=isEdit?"Saving…":"Lighting…";
    const action = isEdit ? updateCandle(myCandle.id, vName, vTribute) : addCandle(vName, vTribute);
    action.then(()=>{renderCta(el, true);renderAll();show("candles");}).catch(()=>{gb.disabled=false;gb.lastChild.textContent=isEdit?"Save Changes":"Light My Candle";err.textContent="Your candle didn\u2019t save. Check your connection and try again.";});
  };
  
  el.querySelector(".go").onclick=go;
  el.querySelector(".cancel").onclick=()=>renderCta(el, true);
  if(isEdit){
    el.querySelector(".del-form").onclick=()=>confirmDelete(el, myCandle.id);
  }
}

function escapeHtml(str){
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderWall(){
  const w=$("wall");w.innerHTML="";
  if(!loaded){w.innerHTML='<p class="empty" style="grid-column:1/-1">Loading candles & tributes</p>';return;}
  if(!candles.length){w.innerHTML='<p class="empty" style="grid-column:1/-1">Be the first to light a candle and leave a tribute for Arleigh.</p>';return;}
  candles.forEach((c)=>{
    const me=mineId&&String(c.id)===String(mineId);
    const d=document.createElement("div");d.className="cd"+(me?" me":"");
    let html='<span class="flame" aria-hidden="true"></span><div class="wick" aria-hidden="true"></div>';
    html+='<div class="name">'+escapeHtml(c.name)+(me?'<small>Your Candle</small>':'')+'</div>';
    if(c.tribute&&c.tribute.trim()){
      html+='<div class="tribute">&ldquo;'+escapeHtml(c.tribute.trim())+'&rdquo;</div>';
    }
    if(me){
      html+='<div class="card-actions"><button type="button" class="btn sm edit-card-btn">Edit</button><button type="button" class="btn sm danger delete-card-btn">Delete</button></div>';
    }
    d.innerHTML=html;
    if(me){
      d.querySelector(".edit-card-btn").onclick=()=>openForm($("cta2"), true);
      d.querySelector(".delete-card-btn").onclick=()=>confirmDelete($("cta2"), c.id);
    }
    w.appendChild(d);
  });
}
function renderAll(){renderCounts();renderCta($("cta"));renderCta($("cta2"));renderWall();}
function show(v){document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id===v));window.scrollTo(0,0);}
$("seeWall").onclick=()=>show("candles");$("back").onclick=()=>show("home");
const gal=$("gal"),hTrack=$("hScrollTrack");const vids=MEDIA.filter(m=>m.t==="v").length;
$("memcount").textContent=(MEDIA.length-vids)+" photos and "+vids+" videos";
MEDIA.forEach((m,i)=>{
  if(hTrack && i < 14){
    const d=document.createElement("div");d.className="h-item";d.setAttribute("role","button");
    d.setAttribute("aria-label",(m.t==="v"?"Play featured video ":"Open featured photo ")+(i+1));
    const img=document.createElement("img");img.alt="";img.loading="lazy";img.decoding="async";img.src=m.t==="v"?m.poster:m.src;
    d.appendChild(img);
    if(m.t==="v"){const p=document.createElement("div");p.className="play";p.innerHTML="<span></span>";d.appendChild(p);}
    d.onclick=()=>openLb(i);hTrack.appendChild(d);
  }
  const b=document.createElement("button");b.type="button";b.className="it";
  b.setAttribute("aria-label",(m.t==="v"?"Play video ":"Open photo ")+(i+1)+" of "+MEDIA.length);
  const img=document.createElement("img");img.alt="";img.loading="lazy";img.decoding="async";img.src=m.t==="v"?m.poster:m.src;
  if(m.w){img.width=m.w;img.height=m.h;}
  b.appendChild(img);if(m.t==="v"){const p=document.createElement("div");p.className="play";p.innerHTML="<span></span>";b.appendChild(p);}
  b.onclick=()=>openLb(i);gal.appendChild(b);
});
let cur=0,lastFocus=null;
function drawLb(){const m=MEDIA[cur],st=$("lbstage");st.innerHTML="";
  if(m.t==="v"){const v=document.createElement("video");v.src=m.src;v.poster=m.poster;v.controls=true;v.playsInline=true;v.autoplay=true;st.appendChild(v);}
  else{const im=document.createElement("img");im.src=m.src;im.alt="Photo "+(cur+1);st.appendChild(im);}
  $("lbpos").textContent=(cur+1)+" of "+MEDIA.length;}
function openLb(i){lastFocus=document.activeElement;cur=i;drawLb();$("lb").classList.add("on");document.body.style.overflow="hidden";$("lbclose").focus();}
function closeLb(){$("lb").classList.remove("on");$("lbstage").innerHTML="";document.body.style.overflow="";if(lastFocus)lastFocus.focus();}
function step(d){cur=(cur+d+MEDIA.length)%MEDIA.length;drawLb();}
$("lbclose").onclick=closeLb;$("lbprev").onclick=()=>step(-1);$("lbnext").onclick=()=>step(1);
document.addEventListener("keydown",e=>{if(!$("lb").classList.contains("on"))return;if(e.key==="Escape")closeLb();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1);});
let sx=null,sy=null;const lb=$("lb");
lb.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
lb.addEventListener("touchend",e=>{if(sx===null||sy===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))step(dx<0?1:-1);sx=null;sy=null;});
renderAll();load();if(SHARED)setInterval(()=>{if(!document.hidden)load();},20000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load();});
</script>
</body>
</html>
